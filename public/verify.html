<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify phone — ZedEvents</title>
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="topbar">
    <a href="/">
      <div class="brand">ZedEvents</div>
      <span class="brand-sub">Verify your phone</span>
    </a>
  </header>

  <main class="wrap">
    <form class="auth-card" id="form">
      <h1>Enter code</h1>
      <p>We sent an SMS code to your phone.</p>
      <div class="error" id="error" hidden></div>
      <div class="field">
        <label for="otp">Code</label>
        <input id="otp" inputmode="numeric" required />
      </div>
      <button class="primary-btn" type="submit">Verify</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const phone = sessionStorage.getItem("ze_pending_phone") || "";
    const error = document.getElementById("error");
    if (!phone) location.href = "/signup.html";

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      try {
        const data = await ZE.api("/auth/verify-otp", {
          method: "POST",
          body: JSON.stringify({
            phone,
            otp: document.getElementById("otp").value.trim(),
          }),
        });
        ZEAuth.setSession(data.token, data.user);
        sessionStorage.removeItem("ze_pending_phone");
        location.href = "/";
      } catch (err) {
        error.hidden = false;
        error.textContent = err.message || "Verification failed.";
      }
    });
  </script>
</body>
</html>
