<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="topbar">
    <a href="/">
      <div class="brand">ZedEvents</div>
      <span class="brand-sub">Create your account</span>
    </a>
  </header>

  <main class="wrap">
    <form class="auth-card" id="form">
      <h1>Join ZedEvents</h1>
      <p>Create an account to save favorites and contact vendors.</p>
      <div class="error" id="error" hidden></div>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" autocomplete="tel" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
      </div>
      <button class="primary-btn" type="submit">Sign up</button>
      <div class="auth-foot">Already have an account? <a href="/login.html">Log in</a></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const error = document.getElementById("error");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      try {
        const data = await ZE.api("/auth/signup", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
            confirmPassword: document.getElementById("confirmPassword").value,
          }),
        });
        sessionStorage.setItem("ze_pending_phone", document.getElementById("phone").value.trim());
        location.href = "/verify.html";
      } catch (err) {
        error.hidden = false;
        error.textContent = err.message || "Sign up failed.";
      }
    });
  </script>
</body>
</html>
