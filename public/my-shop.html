<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - My Shop</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --black: #111111;
      --orange: #C2410C; --orange-hot: #EA580C; --cream: #FFF3E8;
      --price-red: #A3131C; --warn-bg: #FFF3E0; --warn-text: #7A3E00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 72px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .topbar {
      background: var(--orange); padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { color: var(--cream); font-size: 20px; font-weight: 700; }
    .sub-brand { color: #FFD8B8; font-size: 12px; margin-top: 2px; }
    .sell-btn {
      background: #111; color: #F5C518; border: none;
      padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .banner {
      display: none; margin: 12px; padding: 12px 14px; border-radius: 10px;
      background: var(--warn-bg); color: var(--warn-text); font-size: 13px; font-weight: 600; line-height: 1.4;
    }
    .banner.show { display: block; }
    .center-box { padding: 60px 24px; text-align: center; color: var(--subtext); }
    .list { padding: 14px; }
    .row {
      display: flex; align-items: center; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px;
    }
    .thumb {
      width: 60px; height: 60px; border-radius: 10px; background: #E9E2D3;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      margin-right: 12px; flex-shrink: 0; font-size: 24px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row-info { flex: 1; min-width: 0; }
    .row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-price { font-size: 13px; color: var(--price-red); font-weight: 700; margin-top: 2px; }
    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 700; margin-top: 4px; text-transform: uppercase;
    }
    .status-active { background: #E7F5EC; color: #1F7A43; }
    .status-pending { background: var(--warn-bg); color: var(--warn-text); }
    .status-rejected { background: #FBE7E8; color: var(--price-red); }
    .status-removed { background: #EEE; color: var(--subtext); }
    .del-btn {
      width: 40px; height: 40px; border-radius: 20px; margin-left: 8px; flex-shrink: 0;
      background: var(--bg); border: 1px solid var(--border); color: var(--price-red);
      font-weight: 700; cursor: pointer;
    }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
      display: flex; background: #111; border-top: 1px solid #222;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .nav-item {
      flex: 1; text-align: center; color: #9a9490;
      font-size: 10px; font-weight: 600; padding: 4px 2px;
    }
    .nav-item .ico { display: block; font-size: 18px; margin-bottom: 2px; }
    .nav-item.active { color: #F5C518; }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="brand">My Shop</div>
      <div class="sub-brand" id="shopName">Your services</div>
    </div>
    <button class="sell-btn" type="button" onclick="location.href='/post-service.html'">＋ Post</button>
  </div>

  <div class="banner" id="banner"></div>
  <div id="status" class="center-box">Loading…</div>
  <div class="list" id="list" hidden></div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/"><span class="ico">🏠</span>Home</a>
    <a class="nav-item" href="/post-service.html"><span class="ico">＋</span>Post</a>
    <a class="nav-item" href="/chats.html"><span class="ico">💬</span>Chats</a>
    <a class="nav-item active" href="/my-shop.html"><span class="ico">🏪</span>My Shop</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/my-shop.html")) {
      /* redirected */
    } else {
      const user = ZEAuth.getUser();
      const status = document.getElementById("status");
      const list = document.getElementById("list");
      const banner = document.getElementById("banner");
      document.getElementById("shopName").textContent =
        user.business_name || user.name || "Your services";

      if (new URLSearchParams(location.search).get("posted") === "1") {
        banner.textContent = "Submitted — your post is waiting for approval. It won’t show on Home until approved.";
        banner.classList.add("show");
      }

      function statusLabel(s) {
        if (s === "active") return ["Live", "status-active"];
        if (s === "pending") return ["Pending approval", "status-pending"];
        if (s === "rejected") return ["Rejected", "status-rejected"];
        return [s || "Unknown", "status-removed"];
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function load() {
        try {
          const items = await ZE.api("/services/mine");
          if (!items.length) {
            status.textContent = "No services yet. Tap Post to add one.";
            list.hidden = true;
            return;
          }
          status.hidden = true;
          list.hidden = false;
          list.innerHTML = items.map((item) => {
            const photo = ZE.firstPhoto(item.photos);
            const [label, cls] = statusLabel(item.status);
            const price = item.price != null ? `K${Number(item.price).toLocaleString()}` : "Ask for quote";
            const img = photo
              ? `<img src="${photo}" alt="" loading="lazy" />`
              : "🎉";
            const openHref = item.status === "active" ? `/service.html?id=${item.id}` : "#";
            return `
              <div class="row" data-id="${item.id}">
                <a class="row-main" href="${openHref}" style="display:flex;flex:1;align-items:center;min-width:0;">
                  <div class="thumb">${img}</div>
                  <div class="row-info">
                    <div class="row-title">${escapeHtml(item.title || "Untitled")}</div>
                    <div class="row-price">${price}</div>
                    <span class="status-badge ${cls}">${label}</span>
                  </div>
                </a>
                <button class="del-btn" type="button" data-del="${item.id}" aria-label="Delete">×</button>
              </div>`;
          }).join("");

          list.querySelectorAll("[data-del]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (!confirm("Remove this service?")) return;
              try {
                await ZE.api(`/services/${btn.dataset.del}`, { method: "DELETE" });
                load();
              } catch (err) {
                alert(err.message || "Could not delete.");
              }
            });
          });
        } catch (err) {
          status.textContent = err.message || "Could not load your shop.";
        }
      }

      load();
    }
  </script>
</body>
</html>
