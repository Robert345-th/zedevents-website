<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit service — ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="stylesheet" href="/css/extra.css" />
  <style>
    .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-thumb-wrap {
      width: 80px; height: 80px; border-radius: 10px; overflow: hidden; position: relative;
      background: #E9E2D3;
    }
    .photo-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .remove-btn {
      position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: none;
      border-radius: 11px; background: rgba(17,17,17,0.75); color: #fff;
      font-weight: 700; cursor: pointer; line-height: 1;
    }
    .hint { font-size: 12px; color: #5C5955; margin: 0 0 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/my-shop.html">
      <div class="brand">ZedEvents</div>
      <span class="brand-sub">Edit service</span>
    </a>
  </header>

  <main class="wrap">
    <div class="status" id="status">Loading…</div>
    <form class="auth-card" id="form" style="max-width:560px;" hidden>
      <h1>Edit service</h1>
      <p class="hint">After you save, the post goes back to pending and won’t show on Home until approved again.</p>
      <div class="error" id="error" hidden></div>

      <div class="field">
        <label>Photos (up to 5)</label>
        <input id="photos" type="file" accept="image/*" multiple />
        <div class="photo-grid" id="preview"></div>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" required></select>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" required maxlength="120" />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="field">
        <label for="price">Price (K) — optional</label>
        <input id="price" type="number" min="0" step="1" placeholder="Leave blank to ask for quote" />
      </div>

      <button class="primary-btn" type="submit" id="submitBtn">Save changes</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (!ZEAuth.requireLogin(location.pathname + location.search)) {
      /* redirected */
    } else {
      const id = new URLSearchParams(location.search).get("id");
      const status = document.getElementById("status");
      const form = document.getElementById("form");
      const error = document.getElementById("error");
      const preview = document.getElementById("preview");
      const categoryEl = document.getElementById("category");
      let photoUrls = [];
      let newFiles = [];

      function normalizePhotos(photos) {
        if (!photos) return [];
        if (Array.isArray(photos)) return photos.filter(Boolean);
        if (typeof photos === "string") {
          try {
            const parsed = JSON.parse(photos);
            return Array.isArray(parsed) ? parsed.filter(Boolean) : [photos];
          } catch {
            return photos ? [photos] : [];
          }
        }
        return [];
      }

      function renderPhotos() {
        preview.innerHTML = photoUrls.map((url, i) => `
          <div class="photo-thumb-wrap">
            <img src="${url}" alt="" />
            <button type="button" class="remove-btn" data-i="${i}" aria-label="Remove">×</button>
          </div>
        `).join("");
        preview.querySelectorAll("[data-i]").forEach((btn) => {
          btn.addEventListener("click", () => {
            photoUrls.splice(Number(btn.dataset.i), 1);
            renderPhotos();
          });
        });
      }

      if (!id) {
        status.textContent = "No service specified.";
      } else {
        (async () => {
          try {
            const [cats, item] = await Promise.all([
              ZE.api("/services/categories"),
              ZE.api(`/services/${id}`),
            ]);
            const me = ZEAuth.getUser();
            if (!me || String(me.id) !== String(item.vendor_id)) {
              status.textContent = "You can only edit your own services.";
              return;
            }
            categoryEl.innerHTML = cats
              .map((c) => `<option value="${c.id}">${c.name}</option>`)
              .join("");
            document.getElementById("title").value = item.title || "";
            document.getElementById("description").value = item.description || "";
            document.getElementById("price").value = item.price != null ? item.price : "";
            if (item.category_id) categoryEl.value = String(item.category_id);
            photoUrls = normalizePhotos(item.photos);
            renderPhotos();
            status.hidden = true;
            form.hidden = false;
          } catch (err) {
            status.textContent = err.message || "Could not load service.";
          }
        })();
      }

      document.getElementById("photos").addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = "";
        const room = Math.max(0, 5 - photoUrls.length);
        newFiles = files.slice(0, room);
        if (!newFiles.length) {
          if (files.length) ZEUI.error("You can add up to 5 photos.");
          return;
        }
        (async () => {
          try {
            for (const file of newFiles) {
              photoUrls.push(await ZE.uploadImage(file));
            }
            renderPhotos();
          } catch (err) {
            ZEUI.error(err.message || "Photo upload failed.");
          }
        })();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.hidden = true;
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        try {
          const priceVal = document.getElementById("price").value;
          await ZE.api(`/services/${id}`, {
            method: "PUT",
            body: JSON.stringify({
              title: document.getElementById("title").value.trim(),
              description: document.getElementById("description").value.trim(),
              price: priceVal ? Number(priceVal) : null,
              category_id: Number(categoryEl.value) || null,
              photos: photoUrls,
            }),
          });
          location.href = "/my-shop.html?posted=1";
        } catch (err) {
          error.hidden = false;
          error.textContent = err.message || "Could not save changes.";
          btn.disabled = false;
          btn.textContent = "Save changes";
        }
      });
    }
  </script>
</body>
</html>
