<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZedEvents — Event services in Zambia</title>
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="description" content="Find catering, DJs, tents, and more for your event in Zambia." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="topbar">
    <a href="/">
      <div class="brand">ZedEvents</div>
      <span class="brand-sub" id="greet">Event services near you</span>
    </a>
    <div class="top-actions">
      <a class="chip-btn" href="/favorites.html" id="favLink">♥</a>
      <a class="chip-btn" href="/login.html" id="authLink">Login</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Book the right people for your event</h1>
      <p>Browse catering, sound, décor, and more from vendors across Zambia.</p>
    </section>

    <div class="search-row">
      <input id="search" type="search" placeholder="Search services or vendors…" />
    </div>

    <div class="cats" id="cats">
      <button type="button" class="cat active" data-id="">All</button>
    </div>

    <div id="status" class="status">Loading services…</div>
    <div class="grid" id="grid" hidden></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const catsEl = document.getElementById("cats");
    const search = document.getElementById("search");
    let services = [];
    let activeCategory = "";

    function paintAuth() {
      const user = ZEAuth.getUser();
      const greet = document.getElementById("greet");
      const authLink = document.getElementById("authLink");
      if (user) {
        greet.textContent = `Hi, ${user.name || "there"}`;
        authLink.textContent = "Account";
        authLink.href = "/account.html";
      }
    }

    function renderCards(list) {
      if (!list.length) {
        grid.hidden = true;
        status.hidden = false;
        status.textContent = "No services found.";
        return;
      }
      status.hidden = true;
      grid.hidden = false;
      grid.innerHTML = list.map((item) => {
        const photo = ZE.firstPhoto(item.photos) || ZE.firstPhoto(item.business_photo_url);
        const vendor = item.business_name || item.vendor_name || "Vendor";
        const img = photo
          ? `<img class="card-img" src="${photo}" alt="" loading="lazy" />`
          : `<div class="card-img"></div>`;
        return `
          <a class="card" href="/service.html?id=${item.id}">
            ${img}
            <div class="card-body">
              <div class="card-cat">${item.category || "Service"}</div>
              <div class="card-title">${escapeHtml(item.title || "Untitled")}</div>
              <div class="card-vendor">${escapeHtml(vendor)}</div>
              <div class="card-price">${ZE.formatPrice(item.price)}</div>
            </div>
          </a>`;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      const filtered = services.filter((item) => {
        if (activeCategory && String(item.category_id || "") !== String(activeCategory)) {
          // API already filters by category when selected; keep client search only
        }
        if (!q) return true;
        const blob = `${item.title || ""} ${item.description || ""} ${item.business_name || ""} ${item.vendor_name || ""} ${item.category || ""}`.toLowerCase();
        return blob.includes(q);
      });
      renderCards(filtered);
    }

    async function loadCategories() {
      try {
        const cats = await ZE.api("/services/categories");
        cats.forEach((c) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cat";
          btn.dataset.id = c.id;
          btn.textContent = c.name;
          catsEl.appendChild(btn);
        });
      } catch {
        /* ignore */
      }
    }

    async function loadServices() {
      status.hidden = false;
      status.textContent = "Loading services…";
      grid.hidden = true;
      try {
        const path = activeCategory
          ? `/services?category_id=${encodeURIComponent(activeCategory)}`
          : "/services";
        services = await ZE.api(path);
        applyFilter();
      } catch (err) {
        status.hidden = false;
        grid.hidden = true;
        status.textContent = "Could not load services. Check your connection.";
      }
    }

    catsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat");
      if (!btn) return;
      catsEl.querySelectorAll(".cat").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.id || "";
      loadServices();
    });

    search.addEventListener("input", applyFilter);

    paintAuth();
    loadCategories();
    loadServices();
  </script>
</body>
</html>
