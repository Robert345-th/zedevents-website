<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ZedEvents</title>
  <meta name="theme-color" content="#171717" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="topbar">
    <a href="/">
      <div class="brand">ZedEvents</div>
      <span class="brand-sub">Customer website</span>
    </a>
  </header>

  <main class="wrap">
    <form class="auth-card" id="form">
      <h1>Welcome back</h1>
      <p>Log in to save favorites and message vendors.</p>
      <div class="error" id="error" hidden></div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" autocomplete="tel" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="primary-btn" type="submit">Log in</button>
      <div class="auth-foot">No account? <a href="/signup.html">Sign up</a></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/";
    const error = document.getElementById("error");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      try {
        const data = await ZE.api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        ZEAuth.setSession(data.token, data.user);
        location.href = next;
      } catch (err) {
        error.hidden = false;
        error.textContent = err.message || "Login failed.";
      }
    });
  </script>
</body>
</html>
